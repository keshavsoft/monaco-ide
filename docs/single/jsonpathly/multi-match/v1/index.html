<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco IDE — jsonpathly Multi-Match Stepper V1</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden m-0 p-0 font-sans">
    <div class="h-screen w-screen flex flex-col overflow-hidden select-none">
        <header class="h-[42px] bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-3 shrink-0 gap-3">
            <div class="flex items-center gap-2 shrink-0">
                <a href="../../../index.html" class="flex items-center gap-1.5 text-zinc-200 hover:text-white transition">
                    <i class="bi bi-code-slash text-sky-400 text-base"></i>
                    <span class="text-xs font-bold tracking-wider uppercase text-zinc-300">Monaco IDE</span>
                    <span class="text-[10px] font-semibold text-purple-400 bg-purple-950/80 border border-purple-800/80 px-1.5 py-0.2 rounded font-mono">Multi-Match V1</span>
                </a>
                <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>
                <button id="btnFile" type="button" title="Open JSON file (Ctrl+O)" class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-file-earmark-plus text-sky-400"></i>
                    <span>File</span>
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".json,application/json,text/*">
            </div>

            <div class="flex items-center gap-2 flex-1 max-w-xl">
                <div class="relative flex-1 flex items-center">
                    <span class="absolute left-2.5 text-sky-400 text-xs select-none">
                        <i class="bi bi-search"></i>
                    </span>
                    <input id="txtQuery" type="text"
                        placeholder="Query an array (e.g. $.rawAst.program.body[*])..."
                        class="w-full bg-zinc-950 border border-zinc-700/80 rounded pl-7 pr-7 py-1 text-xs font-mono text-sky-200 placeholder-zinc-500 focus:outline-none focus:border-sky-500 transition shadow-inner">
                    <button id="btnClear" type="button" title="Clear query" class="absolute right-2 text-zinc-500 hover:text-zinc-200 text-xs">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                </div>

                <!-- Match Stepper (Shown only when matches > 1) -->
                <div id="stepperContainer" class="hidden flex items-center bg-zinc-800 border border-zinc-700 rounded px-1.5 py-1 text-xs text-zinc-300 gap-1.5 font-mono shrink-0">
                    <button id="btnStepPrev" type="button" title="Previous Match (Shift+F3)" class="hover:text-purple-300 px-1 cursor-pointer">
                        <i class="bi bi-chevron-left text-[11px]"></i>
                    </button>
                    <span id="stepperLabel" class="text-[11px] font-semibold text-purple-300 select-none">1 of 14</span>
                    <button id="btnStepNext" type="button" title="Next Match (F3)" class="hover:text-purple-300 px-1 cursor-pointer">
                        <i class="bi bi-chevron-right text-[11px]"></i>
                    </button>
                </div>

                <button id="btnFind" type="button" title="Find matches (Enter)" class="inline-flex items-center gap-1.5 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white text-xs font-semibold px-3.5 py-1 rounded shadow-sm transition active:scale-95 cursor-pointer shrink-0">
                    <i class="bi bi-search text-[10px]"></i>
                    <span>Find</span>
                </button>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <span class="text-[10px] text-purple-300 bg-purple-950/80 border border-purple-800/80 px-2 py-0.5 rounded font-mono hidden md:inline">
                    🎯 F3: Step Forward | Shift+F3: Step Back
                </span>
                <a href="./proposal.md" title="View Proposal" class="text-zinc-400 hover:text-sky-300 text-xs px-2 py-1 rounded hover:bg-zinc-800/60 transition flex items-center gap-1">
                    <i class="bi bi-file-earmark-text text-[11px]"></i>
                    <span class="hidden sm:inline">Proposal</span>
                </a>
            </div>
        </header>

        <main class="flex-1 flex flex-row overflow-hidden w-full h-full">
            <div id="sourceEditorContainer" class="split-pane-half h-full bg-[#1e1e1e] border-r border-zinc-800 overflow-hidden"></div>
            <div id="resultEditorContainer" class="split-pane-half h-full bg-[#1e1e1e] overflow-hidden"></div>
        </main>

        <footer class="h-[22px] bg-[#007acc] text-white flex items-center justify-between px-3 text-[11px] font-mono select-none shrink-0">
            <div class="flex items-center gap-2">
                <i class="bi bi-gear-wide-connected text-[10px]"></i>
                <span>Monaco Studio</span>
                <span class="text-white/40">|</span>
                <span id="statusCursor">Ln 1, Col 1</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="btnWrap" type="button" class="hover:underline cursor-pointer">Wrap: Off</button>
                <span class="text-white/40">|</span>
                <span>JSON</span>
            </div>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>
</html>
