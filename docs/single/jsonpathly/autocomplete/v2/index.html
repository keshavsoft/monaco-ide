<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco IDE — jsonpathly Autocomplete V1 (Schema-Aware Key Suggestions)</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden m-0 p-0 font-sans">
    <div class="h-screen w-screen flex flex-col overflow-hidden select-none">
        <header class="h-[42px] bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-3 shrink-0 gap-3">
            <div class="flex items-center gap-2 shrink-0">
                <a href="../../../index.html" class="flex items-center gap-1.5 text-zinc-200 hover:text-white transition">
                    <i class="bi bi-code-slash text-sky-400 text-base"></i>
                    <span class="text-xs font-bold tracking-wider uppercase text-zinc-300">Monaco IDE</span>
                    <span class="text-[10px] font-semibold text-teal-400 bg-teal-950/80 border border-teal-800/80 px-1.5 py-0.2 rounded font-mono">Autocomplete V2</span>
                </a>
                <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>
                <button id="btnFile" type="button" title="Open JSON file (Ctrl+O)" class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-file-earmark-plus text-sky-400"></i>
                    <span>File</span>
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".json,application/json,text/*">
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <span class="text-[10px] text-teal-300 bg-teal-950/80 border border-teal-800/80 px-2 py-0.5 rounded font-mono hidden md:inline">
                    ✨ editor-native suggestions
                </span>
                <a href="./proposal.md" title="View Proposal" class="text-zinc-400 hover:text-sky-300 text-xs px-2 py-1 rounded hover:bg-zinc-800/60 transition flex items-center gap-1">
                    <i class="bi bi-file-earmark-text text-[11px]"></i>
                    <span class="hidden sm:inline">Proposal</span>
                </a>
            </div>
        </header>

        <main class="workspace-shell">
            <div id="sourceEditorContainer" class="split-pane-half source-pane"></div>

            <div class="split-pane-half result-pane">
                <div class="query-panel">
                    <label for="txtQuery" class="query-label">JSONPath / JSON helper</label>
                    <div class="query-input-wrap">
                        <span class="query-icon"><i class="bi bi-search"></i></span>
                        <input id="txtQuery" type="text" autocomplete="off" placeholder="Type $.rawAst. ..."
                            class="query-input">
                        <button id="btnClear" type="button" title="Clear query" class="query-clear">
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                        <button id="btnFind" type="button" title="Find matches" class="query-find">
                            <i class="bi bi-search"></i>
                            <span>Find</span>
                        </button>
                    </div>
                    <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
                </div>

                <div id="resultEditorContainer" class="result-editor"></div>
            </div>
        </main>

        <footer class="h-[22px] bg-[#007acc] text-white flex items-center justify-between px-3 text-[11px] font-mono select-none shrink-0">
            <div class="flex items-center gap-2">
                <i class="bi bi-gear-wide-connected text-[10px]"></i>
                <span>Monaco Studio</span>
                <span class="text-white/40">|</span>
                <span id="statusCursor">Ln 1, Col 1</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="btnWrap" type="button" class="hover:underline cursor-pointer">Wrap: Off</button>
                <span class="text-white/40">|</span>
                <span>JSON</span>
            </div>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>
</html>
