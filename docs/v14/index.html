<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco IDE V14</title>
    <!-- Compiled Standalone Tailwind CSS -->
    <link rel="stylesheet" href="./style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Monaco Editor Stylesheet -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
</head>

<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden m-0 p-0 font-sans">
    <div class="h-screen w-screen flex flex-col overflow-hidden select-none">
        <!-- 42px Compact Studio Header -->
        <header class="h-[42px] bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-3 shrink-0">
            <!-- Left: Brand & File Operations -->
            <div class="flex items-center gap-2">
                <a href="../" title="Back to Documentation" class="flex items-center gap-1.5 text-zinc-200 hover:text-white transition">
                    <i class="bi bi-code-slash text-sky-400 text-base"></i>
                    <span class="text-xs font-bold tracking-wider uppercase text-zinc-300">Monaco IDE</span>
                    <span class="text-[10px] font-semibold text-sky-400 bg-sky-950/80 border border-sky-800/80 px-1.5 py-0.2 rounded">v14</span>
                </a>

                <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>

                <!-- Toggle Sidebar (Ctrl+B) -->
                <button id="sidebarToggleBtn" type="button" title="Toggle Explorer (Ctrl+B)"
                    class="inline-flex items-center justify-center h-7 w-7 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-300 text-xs rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-layout-sidebar-inset"></i>
                </button>

                <!-- Open Files (Ctrl+O) -->
                <button id="openFileBtn" type="button" title="Open files from disk (Ctrl+O)"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-file-earmark-plus text-sky-400"></i>
                    <span>File</span>
                </button>
                <input type="file" id="fileInput" class="hidden" multiple accept=".json,.js,.mjs,.cjs,.ts,.tsx,.html,.htm,.css,.scss,.txt,.md,.xml,.svg,application/json,text/*">

                <!-- Open Workspace Folder -->
                <button id="openFolderBtn" type="button" title="Open Project Directory"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-folder2-open text-amber-400"></i>
                    <span>Folder</span>
                </button>

                <!-- Quick Open Palette (Ctrl+P) -->
                <button id="quickOpenTrigger" type="button" title="Go to File (Ctrl+P)"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-300 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-search text-zinc-400"></i>
                    <span class="hidden md:inline">Go to File</span>
                    <span class="text-[9px] bg-zinc-900 border border-zinc-700 px-1 py-0.2 rounded font-mono text-zinc-400">Ctrl+P</span>
                </button>

                <!-- Direct Disk Save (Ctrl+S) -->
                <button id="saveFileBtn" type="button" title="Save active tab directly to disk (Ctrl+S)"
                    class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-floppy"></i>
                    <span>Save</span>
                    <span class="text-[9px] bg-emerald-950/60 border border-emerald-700/60 px-1 py-0.2 rounded font-mono text-emerald-200">Ctrl+S</span>
                </button>

                <!-- Code Formatter (Shift+Alt+F) -->
                <button id="formatBtn" type="button" title="Format code (Shift+Alt+F)"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-magic text-yellow-400"></i>
                    <span>Format</span>
                </button>

                <!-- Live Split Preview Toggle (Ctrl+\) -->
                <button id="splitPreviewBtn" type="button" title="Toggle Live Preview (Ctrl+\)"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-layout-split text-sky-400"></i>
                    <span>Preview</span>
                </button>

                <!-- Full Preview Button -->
                <button id="openFullPreviewBtn" type="button" title="Open full preview in a new browser tab"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-box-arrow-up-right text-sky-400"></i>
                    <span>Full Preview</span>
                </button>

                <!-- Run Active File in Terminal (like VS Code) -->
                <button id="runCodeBtn" type="button" title="Run Active File in Terminal (F5)"
                    class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-play-fill text-sm"></i>
                    <span>Run</span>
                </button>

                <!-- Toggle Integrated Terminal (Ctrl+`) -->
                <button id="toggleTerminalBtn" type="button" title="Toggle Terminal (Ctrl+`)"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700/60 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-terminal text-sky-400"></i>
                    <span>Terminal</span>
                </button>

                <span id="previewTabStatus" class="text-[9px] text-zinc-500 font-mono"></span>
            </div>

            <!-- Right: Status & Active File Indicator Badge -->
            <div class="flex items-center gap-2">
                <!-- Save Status Notification -->
                <span id="saveStatus" class="hidden text-[10px] font-semibold text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2 py-0.5 rounded">
                    Saved ✓
                </span>

                <!-- Total Open Tabs Badge -->
                <span id="tabCount" class="text-[10px] text-zinc-400 bg-zinc-800 border border-zinc-700/60 px-2 py-0.5 rounded font-mono">
                    1 file
                </span>

                <!-- Active File Info Pill -->
                <div class="inline-flex items-center gap-2 bg-zinc-800/80 border border-zinc-700/60 rounded-md px-2.5 py-1 text-xs">
                    <i class="bi bi-filetype-json text-amber-400" id="fileIcon"></i>
                    <span class="text-zinc-400 font-medium">Active:</span>
                    <span id="fileName" class="text-zinc-100 font-semibold font-mono truncate max-w-[120px]">sample.json</span>
                    <span id="dirtyDot" class="hidden w-2 h-2 rounded-full bg-amber-400 animate-pulse" title="Unsaved changes"></span>
                    <span id="fileSize" class="text-[10px] text-zinc-400 bg-zinc-700/60 px-1.5 py-0.2 rounded">0.4 KB</span>
                </div>

                <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>

                <!-- Navigation to Portal -->
                <a href="../" title="Back to Docs Portal" class="text-zinc-400 hover:text-zinc-200 text-xs px-2 py-1 rounded hover:bg-zinc-800/60 transition flex items-center gap-1">
                    <i class="bi bi-box-arrow-up-right text-[10px]"></i>
                    <span class="hidden sm:inline">Docs</span>
                </a>
            </div>
        </header>

        <!-- Main Workspace Body (Sidebar + Tabs + Canvas + Split Preview + Bottom Terminal) -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Left Workspace File Explorer Sidebar (~220px) -->
            <aside id="sidebar" class="w-[220px] bg-zinc-900 border-r border-zinc-800 flex flex-col shrink-0 select-none overflow-hidden">
                <!-- Sidebar Header -->
                <div class="h-[34px] px-3 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-400 shrink-0">
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        <i class="bi bi-folder-fill text-amber-400 text-xs"></i>
                        <span id="workspaceName" class="font-bold uppercase tracking-wider text-[10px] text-zinc-300 truncate">Workspace</span>
                    </div>
                    <button id="refreshTreeBtn" type="button" title="Refresh Explorer" class="text-zinc-400 hover:text-zinc-100 p-1 rounded transition">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>

                <!-- Folder Tree View Container -->
                <div id="folderTree" class="flex-1 overflow-y-auto no-scrollbar p-1.5 flex flex-col gap-0.5">
                    <div class="p-3 text-center text-xs text-zinc-500">
                        <i class="bi bi-folder2-open text-2xl mb-2 block opacity-40"></i>
                        <span>No folder opened</span>
                        <button id="sidebarOpenFolderPrompt" type="button" class="mt-2 text-[11px] text-sky-400 hover:underline block w-full text-center">
                            Open Folder &rarr;
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Center & Right Area: Tabs + Editor + Live Preview + Terminal Panel -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- 34px Multi-Document Tab Strip Container -->
                <nav id="tabStripContainer" class="h-[34px] bg-zinc-900/90 border-b border-zinc-800 flex items-center justify-between shrink-0">
                    <!-- Scrollable Tabs Area -->
                    <div id="tabStrip" class="flex-1 flex items-center overflow-x-auto no-scrollbar h-full"></div>

                    <!-- New Tab Action Button -->
                    <button id="newTabBtn" type="button" title="New Untitled Buffer"
                        class="h-full px-3 text-zinc-400 hover:text-white hover:bg-zinc-800 border-l border-zinc-800 transition flex items-center justify-center cursor-pointer shrink-0">
                        <i class="bi bi-plus-lg text-sm"></i>
                    </button>
                </nav>

                <!-- Editor Canvas + Live Split Preview Container -->
                <div class="flex-1 flex overflow-hidden relative">
                    <!-- Monaco Editor Canvas -->
                    <main class="flex-1 h-full bg-[#1e1e1e] overflow-hidden relative">
                        <div id="jsonEditor" class="w-full h-full"></div>
                    </main>

                    <!-- Live Split Preview Pane with Popout Button -->
                    <section id="previewPane" class="w-1/2 h-full border-l border-zinc-800 bg-zinc-950 flex flex-col hidden overflow-hidden">
                        <div class="h-[30px] bg-zinc-900/80 border-b border-zinc-800 px-3 flex items-center justify-between text-xs text-zinc-400 select-none shrink-0">
                            <div class="flex items-center gap-2">
                                <i class="bi bi-eye text-sky-400"></i>
                                <span class="font-semibold text-zinc-200">Live Preview</span>
                                <span id="previewLangBadge" class="text-[10px] bg-zinc-800 border border-zinc-700/60 px-1.5 py-0.2 rounded font-mono text-zinc-300">HTML</span>
                                <span class="text-[9px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-1.5 py-0.2 rounded">Virtual CSS Active</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button id="popoutPreviewBtn" type="button" title="Open Preview in Separate Browser Tab" class="text-zinc-400 hover:text-sky-300 p-0.5 rounded transition">
                                    <i class="bi bi-box-arrow-up-right text-xs"></i>
                                </button>
                                <button id="closePreviewBtn" type="button" title="Close Preview (Ctrl+\)" class="text-zinc-400 hover:text-zinc-100 p-0.5 rounded transition">
                                    <i class="bi bi-x-lg text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <div id="previewContainer" class="flex-1 overflow-hidden bg-zinc-950"></div>
                    </section>
                </div>

                <!-- Resizer Handle for Terminal Panel -->
                <div id="terminalResizer" class="h-1 bg-zinc-800 hover:bg-sky-500 cursor-row-resize transition hidden"></div>

                <!-- VS Code Style Integrated Terminal Panel -->
                <section id="terminalPanel" class="h-60 bg-zinc-950 border-t border-zinc-800 flex flex-col hidden overflow-hidden select-text">
                    <!-- Terminal Header Bar (Tabs + Shell Selector + Actions) -->
                    <div class="h-[30px] bg-zinc-900 border-b border-zinc-800 px-3 flex items-center justify-between text-xs text-zinc-400 select-none shrink-0">
                        <!-- Panel Tabs (PROBLEMS, OUTPUT, DEBUG CONSOLE, TERMINAL) -->
                        <div class="flex items-center gap-4 h-full">
                            <button id="terminalTabProblems" type="button" class="text-[11px] font-medium text-zinc-400 hover:text-zinc-200 uppercase tracking-wider flex items-center gap-1.5 h-full border-b-2 border-transparent">
                                <span>Problems</span>
                                <span class="text-[9px] bg-zinc-800 px-1 rounded text-zinc-400">0</span>
                            </button>
                            <button id="terminalTabOutput" type="button" class="text-[11px] font-medium text-zinc-400 hover:text-zinc-200 uppercase tracking-wider h-full border-b-2 border-transparent">
                                Output
                            </button>
                            <button id="terminalTabDebug" type="button" class="text-[11px] font-medium text-zinc-400 hover:text-zinc-200 uppercase tracking-wider h-full border-b-2 border-transparent">
                                Debug Console
                            </button>
                            <button id="terminalTabTerminal" type="button" class="text-[11px] font-semibold text-white uppercase tracking-wider flex items-center gap-1.5 h-full border-b-2 border-sky-400">
                                <i class="bi bi-terminal text-sky-400"></i>
                                <span>Terminal</span>
                            </button>
                        </div>

                        <!-- Right Controls: Shell Selector Dropdown, Add, Clear, Maximize, Close -->
                        <div class="flex items-center gap-2">
                            <!-- Shell Selector Dropdown (cmd, powershell, node, bash) -->
                            <div class="flex items-center gap-1.5 bg-zinc-800 border border-zinc-700/60 rounded px-1.5 py-0.5 text-[11px]">
                                <i id="shellIcon" class="bi bi-terminal text-sky-400 text-xs"></i>
                                <select id="shellSelect" class="bg-transparent text-zinc-200 text-[11px] font-medium outline-none cursor-pointer">
                                    <option value="cmd" class="bg-zinc-900 text-zinc-100">cmd (Command Prompt)</option>
                                    <option value="powershell" class="bg-zinc-900 text-zinc-100">powershell (Windows PowerShell)</option>
                                    <option value="node" class="bg-zinc-900 text-zinc-100">node (Node.js REPL)</option>
                                    <option value="bash" class="bg-zinc-900 text-zinc-100">bash (Git Bash)</option>
                                </select>
                            </div>

                            <!-- New Terminal Button (+) -->
                            <button id="newTerminalBtn" type="button" title="New Terminal" class="text-zinc-400 hover:text-zinc-100 p-1 rounded hover:bg-zinc-800 transition">
                                <i class="bi bi-plus-lg text-xs"></i>
                            </button>

                            <!-- Clear Terminal Button (Trash / cls) -->
                            <button id="clearTerminalBtn" type="button" title="Clear Terminal (cls)" class="text-zinc-400 hover:text-zinc-100 p-1 rounded hover:bg-zinc-800 transition">
                                <i class="bi bi-trash text-xs"></i>
                            </button>

                            <!-- Maximize / Restore Button -->
                            <button id="maxTerminalBtn" type="button" title="Maximize/Restore Panel" class="text-zinc-400 hover:text-zinc-100 p-1 rounded hover:bg-zinc-800 transition">
                                <i class="bi bi-chevron-up text-xs" id="maxTerminalIcon"></i>
                            </button>

                            <!-- Close Panel Button (X) -->
                            <button id="closeTerminalBtn" type="button" title="Close Panel (Ctrl+`)" class="text-zinc-400 hover:text-zinc-100 p-1 rounded hover:bg-zinc-800 transition">
                                <i class="bi bi-x-lg text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terminal Content Body -->
                    <div id="terminalBody" class="flex-1 overflow-y-auto p-3 font-mono text-xs text-zinc-200 flex flex-col gap-1 cursor-text bg-zinc-950">
                        <div id="terminalOutput" class="flex flex-col gap-0.5"></div>
                        <!-- Active Command Prompt Line -->
                        <div id="terminalPromptLine" class="flex items-center gap-1.5 mt-0.5">
                            <span id="terminalPromptLabel" class="text-emerald-400 font-bold shrink-0 select-none">C:\Users\SREE\monaco-ide&gt;</span>
                            <input id="terminalInput" type="text" autocomplete="off" spellcheck="false" class="flex-1 bg-transparent text-zinc-100 text-xs font-mono outline-none border-none p-0 focus:ring-0">
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- 22px Compact Studio Status Bar -->
        <footer class="h-[22px] bg-sky-950 border-t border-sky-800/60 px-3 flex items-center justify-between text-[11px] text-zinc-300 select-none shrink-0">
            <!-- Left: Studio & Cursor Position -->
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1.5 text-sky-300 font-semibold">
                    <i class="bi bi-cpu text-xs"></i>
                    <span>Monaco Studio</span>
                </span>
                <span class="text-sky-800">|</span>
                <span id="cursorPos" class="font-mono text-zinc-300">Ln 1, Col 1</span>
            </div>

            <!-- Right: Studio Controls (Wrap, Map, Encoding, Language) -->
            <div class="flex items-center gap-3 font-mono text-[10px]">
                <span id="toggleWordWrapBtn" class="status-bar-item text-zinc-400 rounded px-1.5 py-0.5 hover:text-white" title="Toggle Word Wrap (Alt+Z)">
                    Wrap: Off
                </span>
                <span id="toggleMinimapBtn" class="status-bar-item text-zinc-400 rounded px-1.5 py-0.5 hover:text-white" title="Toggle Minimap">
                    Map: Off
                </span>
                <span class="text-zinc-400">UTF-8</span>
                <span class="text-zinc-400">Spaces: 2</span>
                <span id="statusLanguage" class="text-sky-300 font-bold bg-sky-900/60 px-1.5 py-0.2 rounded border border-sky-700/60">
                    JSON
                </span>
            </div>
        </footer>
    </div>

    <!-- Quick Open File Switcher Modal (Ctrl+P) -->
    <div id="quickOpenModal" class="hidden fixed inset-0 z-50 flex items-start justify-center pt-16">
        <div id="quickOpenBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative w-full max-w-lg bg-zinc-900 border border-zinc-700 rounded-lg shadow-2xl overflow-hidden flex flex-col z-10">
            <div class="p-2 border-b border-zinc-800 flex items-center gap-2 px-3">
                <i class="bi bi-search text-zinc-400 text-sm"></i>
                <input id="quickOpenInput" type="text" placeholder="Type a file name to open... (↑ ↓ to navigate, Esc to close)"
                    class="w-full bg-transparent text-sm text-zinc-100 placeholder-zinc-500 outline-none font-mono">
            </div>
            <div id="quickOpenList" class="max-h-72 overflow-y-auto p-1.5 flex flex-col gap-0.5 no-scrollbar"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
