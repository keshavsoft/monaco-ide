<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco IDE — V1</title>
    <!-- Compiled Standalone Tailwind CSS -->
    <link rel="stylesheet" href="./style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Monaco Editor Stylesheet -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
</head>

<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden m-0 p-0">
    <div class="h-screen w-screen flex flex-col overflow-hidden select-none">
        <!-- 42px Compact Studio Header -->
        <header class="h-[42px] bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-3 shrink-0">
            <!-- Left: Brand & Select File Action -->
            <div class="flex items-center gap-2">
                <a href="../index.html" title="Back to Archive" class="flex items-center gap-1.5 text-zinc-200 hover:text-white transition">
                    <i class="bi bi-code-slash text-sky-400 text-base"></i>
                    <span class="text-xs font-bold tracking-wider uppercase text-zinc-300">Monaco IDE</span>
                    <span class="text-[10px] font-semibold text-sky-400 bg-sky-950/80 border border-sky-800/80 px-1.5 py-0.2 rounded">v1</span>
                </a>

                <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>

                <button id="selectFileBtn" type="button"
                    class="inline-flex items-center gap-1.5 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white text-xs font-semibold px-3 py-1 rounded-md shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-folder2-open"></i>
                    <span>Select File</span>
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".json,.js,.ts,.html,.css,.txt,.md,application/json,text/*">
            </div>

            <!-- Right: Active File Indicator Badge -->
            <div class="flex items-center gap-2">
                <div class="inline-flex items-center gap-2 bg-zinc-800/80 border border-zinc-700/60 rounded-md px-2.5 py-1 text-xs">
                    <i class="bi bi-file-earmark-code text-sky-400" id="fileIcon"></i>
                    <span class="text-zinc-400 font-medium">File:</span>
                    <span id="fileName" class="text-zinc-100 font-semibold font-mono">sample.json</span>
                    <span id="fileSize" class="text-[10px] text-zinc-400 bg-zinc-700/60 px-1.5 py-0.2 rounded">0 KB</span>
                </div>
                <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>
                <a href="../index.html" title="Back to Archive" class="text-zinc-400 hover:text-zinc-200 text-xs px-2 py-1 rounded hover:bg-zinc-800/60 transition">
                    Archive
                </a>
                <a href="../../index.html" title="Back to Docs Portal" class="text-zinc-400 hover:text-zinc-200 text-xs px-2 py-1 rounded hover:bg-zinc-800/60 transition">
                    Docs
                </a>
            </div>
        </header>

        <!-- Fullscreen Monaco Editor Canvas -->
        <main class="flex-1 w-full bg-[#1e1e1e] overflow-hidden relative">
            <div id="jsonEditor" class="w-full h-full"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
