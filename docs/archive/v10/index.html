<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco IDE V10 — In-Browser Virtual Server</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Monaco Editor Stylesheet -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden m-0 p-0 font-sans select-none">
    <div class="h-screen w-screen flex flex-col overflow-hidden">
        
        <!-- Header (44px) -->
        <header class="h-[44px] bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-3 shrink-0">
            <!-- Left Branding & Tools -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 text-zinc-200">
                    <i class="bi bi-code-slash text-sky-400 text-lg"></i>
                    <span class="text-xs font-bold tracking-wider uppercase text-zinc-200">Monaco IDE</span>
                    <span class="text-[10px] font-bold text-sky-300 bg-sky-950 border border-sky-800 px-1.5 py-0.5 rounded">V10</span>
                </div>

                <div class="h-4 w-[1px] bg-zinc-800"></div>

                <!-- Select Folder Button -->
                <button id="selectFolderBtn" type="button" title="Select folder from your computer"
                    class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs font-semibold px-2.5 py-1 rounded shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-folder2-open text-amber-400 text-sm"></i>
                    <span>Folder</span>
                </button>

                <!-- Save to Disk (Ctrl+S) -->
                <button id="saveBtn" type="button" title="Save active buffer to disk (Ctrl+S)"
                    class="inline-flex items-center gap-1.5 bg-emerald-700 hover:bg-emerald-600 active:bg-emerald-800 text-white text-xs font-semibold px-2.5 py-1 rounded shadow-sm transition active:scale-95 cursor-pointer">
                    <i class="bi bi-floppy"></i>
                    <span>Save</span>
                    <span class="text-[9px] bg-emerald-950/80 px-1 py-0.5 rounded font-mono text-emerald-200">Ctrl+S</span>
                </button>

                <div class="h-4 w-[1px] bg-zinc-800"></div>

                <!-- Preview Entry Selector & Launch Button -->
                <div class="flex items-center gap-1.5 bg-zinc-950/80 border border-zinc-800 rounded p-1">
                    <span class="text-[11px] text-zinc-400 font-medium pl-1">Entry:</span>
                    <select id="entrySelect" disabled
                        class="bg-zinc-900 text-sky-300 border border-zinc-700 text-xs rounded px-2 py-0.5 outline-none font-mono max-w-[200px]">
                        <option value="">No folder opened</option>
                    </select>

                    <button id="previewBtn" type="button" title="Open Virtual Server preview in a separate browser tab"
                        class="inline-flex items-center gap-1.5 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white text-xs font-semibold px-3 py-1 rounded shadow-sm transition active:scale-95 cursor-pointer">
                        <i class="bi bi-box-arrow-up-right text-xs"></i>
                        <span>Preview in New Tab</span>
                    </button>
                </div>
            </div>

            <!-- Right Status Badges -->
            <div class="flex items-center gap-3">
                <span id="saveIndicator" class="text-zinc-500 font-mono text-[11px]"></span>
                <span id="fileCountBadge" class="text-[10px] text-zinc-400 bg-zinc-800 border border-zinc-700/60 px-2 py-0.5 rounded font-mono">0 files</span>
                <span id="statusBadge" class="text-xs px-2.5 py-1 rounded font-mono bg-zinc-800 text-zinc-400 border border-zinc-700 flex items-center gap-1.5">
                    Initializing…
                </span>
            </div>
        </header>

        <!-- Main Workspace: Sidebar + Editor -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar: Workspace Explorer (~240px) -->
            <aside class="w-[240px] bg-zinc-900 border-r border-zinc-800 flex flex-col shrink-0 overflow-hidden">
                <!-- Sidebar Title -->
                <div class="h-[32px] px-3 bg-zinc-900/90 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-400 shrink-0">
                    <div class="flex items-center gap-1.5 truncate">
                        <i class="bi bi-folder-fill text-amber-400 text-xs"></i>
                        <span id="folderNameDisplay" class="font-bold uppercase tracking-wider text-[11px] text-zinc-300 truncate">No Folder</span>
                    </div>
                </div>

                <!-- File List Tree -->
                <div id="fileTree" class="flex-1 overflow-y-auto p-1.5 flex flex-col gap-0.5">
                    <div class="p-4 text-center text-xs text-zinc-500 flex flex-col items-center">
                        <i class="bi bi-folder2-open text-3xl mb-2 text-zinc-600"></i>
                        <p class="font-medium text-zinc-400">No folder selected</p>
                        <button id="sidebarSelectFolderBtn" type="button"
                            class="mt-3 text-xs text-sky-400 hover:text-sky-300 font-semibold hover:underline block cursor-pointer">
                            Open Folder &rarr;
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Center: Editor Area -->
            <main class="flex-1 flex flex-col overflow-hidden bg-[#1e1e1e]">
                <!-- Active File Ribbon -->
                <div class="h-[32px] bg-zinc-900/80 border-b border-zinc-800 px-3 flex items-center justify-between text-xs text-zinc-300 shrink-0">
                    <div class="flex items-center gap-2">
                        <i class="bi bi-file-earmark-code text-sky-400"></i>
                        <span id="activeFileName" class="font-semibold text-zinc-100">Welcome</span>
                        <span id="activeFileBadge" class="text-[10px] text-zinc-500 font-mono"></span>
                    </div>
                    <div class="text-[11px] text-zinc-500 font-mono">
                        Auto-sync to Virtual Server: <span class="text-emerald-400 font-bold">ON</span>
                    </div>
                </div>

                <!-- Monaco Editor Canvas -->
                <div id="monacoContainer" class="flex-1 w-full h-full overflow-hidden"></div>
            </main>
        </div>

        <!-- Status Bar (22px) -->
        <footer class="h-[22px] bg-zinc-950 border-t border-zinc-800 px-3 flex items-center justify-between text-[11px] text-zinc-400 shrink-0 font-mono">
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1 text-sky-400 font-semibold">
                    <i class="bi bi-cpu text-xs"></i>
                    <span>Virtual Server Engine</span>
                </span>
                <span class="text-zinc-700">|</span>
                <span id="cursorPos">Ln 1, Col 1</span>
            </div>

            <div class="flex items-center gap-3">
                <span>UTF-8</span>
                <span>Spaces: 2</span>
                <span class="text-sky-300 font-semibold">Monaco v0.52.2</span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./app.js"></script>
</body>

</html>
