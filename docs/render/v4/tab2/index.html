<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ensure directory URLs always have trailing slash so relative paths resolve correctly -->
    <script>
        if (!location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>
    <title>Live Render — Tab 2 Consumer</title>
    <!-- Production UI Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Silent Receiver Script in Head (Zero DOM footprint in body) -->
    <script type="module" src="./js/index.js"></script>
</head>

<body id="app" class="p-3 bg-white">
    <!-- PURE CANVAS: Renders ONLY what Tab 1 supplies. No headers, no footers, no wrappers. -->
</body>

</html>
